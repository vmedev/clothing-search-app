
<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Apģērbu meklētājs{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="galvene">
        <div class="konteiners galvenes-saturs">
            <a href="/" class="logotips">Apģērbu meklētājs</a>

            <nav class="izvelne">
                <a href="/">Sākums</a>
                <a href="/search">Meklēt apģērbu</a>
                <a href="/favorites">Izlase</a>
                <a href="/history">Meklēšanas vēsture</a>
                <a href="/login" class="pieteiksanas">Pieteikties</a>
            </nav>
        </div>
    </header>

    <main class="konteiners galvenais-saturs">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="kajene">
        <p>© 2026 Sieriņi | Apģērbu meklētājs</p>
    </footer>

</body>
</html>
