
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit search | THREADFINDER</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="site-header">
    <nav th:replace="~{fragments :: navbar}"></nav>
</div>

<main class="container">
    <section class="hero history-hero">
        <p class="eyebrow">UPDATE YOUR PREFERENCES</p>
        <h1>Edit your<br><span>search.</span></h1>
        <p class="hero-description">
            Change the filters saved in your search history.
        </p>
    </section>

    <section class="filter-panel edit-panel">
        <h2>Search filters</h2>

        <p class="error-message"
           th:if="${errorMessage != null}"
           th:text="${errorMessage}"></p>

        <form th:action="@{/history/{id}/edit(id=${historyItem.id})}"
              th:object="${filters}" method="post"
              class="filter-form edit-form">

            <div class="field">
                <label for="category">Category</label>
                <select id="category" th:field="*{category}">
                    <option value="">All categories</option>
                    <option th:each="category : ${categories}"
                            th:value="${category}"
                            th:text="${category}"></option>
                </select>
            </div>

            <div class="field">
                <label for="color">Colour</label>
                <select id="color" th:field="*{color}">
                    <option value="">All colours</option>
                    <option th:each="color : ${colors}"
                            th:value="${color}"
                            th:text="${color}"></option>
                </select>
            </div>

            <div class="field">
                <label for="brand">Brand</label>
                <select id="brand" th:field="*{brand}">
                    <option value="">All brands</option>
                    <option th:each="brand : ${brands}"
                            th:value="${brand}"
                            th:text="${brand}"></option>
                </select>
            </div>

            <div class="field">
                <label for="minPrice">Min price (€)</label>
                <input id="minPrice" type="number" step="0.01"
                       min="0" th:field="*{minPrice}"
                       placeholder="0.00">
            </div>

            <div class="field">
                <label for="maxPrice">Max price (€)</label>
                <input id="maxPrice" type="number" step="0.01"
                       min="0" th:field="*{maxPrice}"
                       placeholder="Any">
            </div>

            <button type="submit" class="primary-button">
                Save changes
            </button>

            <a th:href="@{/history}" class="secondary-button">
                Cancel
            </a>
        </form>
    </section>
</main>

<footer class="site-footer">
    <p>THREADFINDER — Find your own style.</p>
</footer>

</body>
</html>
