<!DOCTYPE html>
<html lang="lv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pieteikšanās | Apģērbu meklētājs</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="site-header">
    <nav th:replace="~{search/fragments :: navbar-simple}"></nav>
</div>

<main class="container">
    <section class="auth-card">
        <p class="eyebrow">LAIPNI LŪDZAM</p>
        <h1>Pieteikšanās</h1>
        <p class="auth-subtitle">Lai ienāktu kontā, ir jāautorizējas</p>

        <p th:if="${param.required != null}" class="info-message">
            Meklēšanas vēsture un izlase ir pieejamas tikai reģistrētiem lietotājiem. Lūdzu, piesakies.
        </p>
        <p th:if="${error}" class="error-message" th:text="${error}"></p>
        <p th:if="${success}" class="success-message" th:text="${success}"></p>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="field">
                <label for="username">Lietotājvārds</label>
                <input id="username" name="username" type="text" th:value="${username}"
                       required autofocus autocomplete="username">
            </div>

            <div class="field">
                <label for="password">Parole</label>
                <input id="password" name="password" type="password"
                       required autocomplete="current-password">
            </div>

            <button type="submit" class="primary-button">Pieteikties</button>
        </form>

        <p class="auth-links">Nav konta? <a th:href="@{/register}">Reģistrēties</a></p>
        <p class="guest-link"><a th:href="@{/guest}">Ieiet kā viesis</a></p>
    </section>
</main>

<footer class="site-footer">
    <p>Apģērbu meklētājs. Atrodi savu stilu.</p>
</footer>

</body>
</html>
