<!DOCTYPE html>
<html lang="lv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labot meklējumu | THREADFINDER</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="site-header">
    <nav th:replace="~{search/fragments :: navbar}"></nav>
</div>

<main class="container">
    <section class="hero history-hero">
        <p class="eyebrow">ATJAUNO SAVAS IZVĒLES</p>
        <h1>Labot<br><span>meklējumu.</span></h1>
        <p class="hero-description">Maini vēsturē saglabātos meklēšanas filtrus.</p>
    </section>

    <section class="filter-panel edit-panel">
        <h2>Meklēšanas filtri</h2>

        <p class="error-message" th:if="${errorMessage != null}" th:text="${errorMessage}"></p>

        <form th:action="@{/history/{id}/edit(id=${historyItem.id})}"
              th:object="${filters}" method="post" class="filter-form edit-form">

            <div class="field">
                <label for="category">Kategorija</label>
                <select id="category" th:field="*{category}">
                    <option value="">Visas kategorijas</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>

            <div class="field">
                <label for="color">Krāsa</label>
                <select id="color" th:field="*{color}">
                    <option value="">Visas krāsas</option>
                    <option th:each="c : ${colors}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>

            <div class="field">
                <label for="brand">Zīmols</label>
                <select id="brand" th:field="*{brand}">
                    <option value="">Visi zīmoli</option>
                    <option th:each="b : ${brands}" th:value="${b}" th:text="${b}"></option>
                </select>
            </div>

            <div class="field">
                <label for="minPrice">Cena no (€)</label>
                <input id="minPrice" type="number" step="0.01" min="0"
                       th:field="*{minPrice}" placeholder="0.00">
            </div>

            <div class="field">
                <label for="maxPrice">Cena līdz (€)</label>
                <input id="maxPrice" type="number" step="0.01" min="0"
                       th:field="*{maxPrice}" placeholder="Jebkura">
            </div>

            <button type="submit" class="primary-button">Saglabāt</button>
            <a th:href="@{/history}" class="secondary-button">Atcelt</a>
        </form>
    </section>
</main>

<footer class="site-footer">
    <p>THREADFINDER. Atrodi savu stilu.</p>
</footer>

</body>
</html>
