<!DOCTYPE html>
<html lang="lv" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.description} + ' | Apģērbu meklētājs'">Prece | Apģērbu meklētājs</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/prece.css}">
</head>
<body>

<div class="site-header">
    <nav th:replace="~{search/fragments :: navbar}"></nav>
</div>

<main class="container">
    <a href="javascript:history.back()" class="back-link">← Atpakaļ</a>

    <div class="messages">
        <p th:if="${error}" class="error-message" th:text="${error}"></p>
        <p th:if="${success}" class="success-message" th:text="${success}"></p>
        <p th:if="${info}" class="info-message" th:text="${info}"></p>
    </div>

    <article class="product-detail">
        <div class="product-detail-image">
            <img th:src="@{/img/{f}(f=${product.imageName})}" th:alt="${product.description}">
        </div>

        <div class="product-detail-info">
            <p class="eyebrow" th:if="${product.category != null}"
               th:text="${product.category.name}">Kategorija</p>
            <h1 th:text="${product.description}">sporta jaka</h1>
            <p class="product-detail-price"
               th:text="${#numbers.formatDecimal(product.price, 1, 2)} + ' €'">55.95 €</p>

            <dl class="product-detail-data">
                <dt>Zīmols</dt>
                <dd th:text="${product.brand} ?: '—'">adidas</dd>
                <dt>Krāsa</dt>
                <dd th:text="${product.color} ?: '—'">melna</dd>
                <dt>Veikals</dt>
                <dd th:text="${storeName}">Zalando</dd>
            </dl>

            <div class="product-actions">
                <form th:if="${!inFavorites}"
                      th:action="@{/product/{id}/favorite(id=${product.id})}" method="post">
                    <button type="submit" class="primary-button">♡ Pievienot izlasei</button>
                </form>
                <form th:if="${inFavorites}"
                      th:action="@{/product/{id}/favorite/remove(id=${product.id})}" method="post">
                    <button type="submit" class="secondary-button">♥ Izlasē · Noņemt</button>
                </form>

                <a th:href="@{/product/{id}/store(id=${product.id})}" class="secondary-button"
                   target="_blank" rel="noopener">Pāriet uz veikalu ↗</a>
            </div>
        </div>
    </article>
</main>

<footer class="site-footer">
    <p>Apģērbu meklētājs. Atrodi savu stilu.</p>
</footer>

</body>
</html>
